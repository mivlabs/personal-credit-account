name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + unit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.1.0
        with:
          version: "0.11.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit -q

  integration:
    name: backend (integration, PostgreSQL + WireMock)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: credit
          POSTGRES_PASSWORD: credit
          POSTGRES_DB: credit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credit -d credit"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://credit:credit@127.0.0.1:5432/credit
      MOCKS_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: astral-sh/setup-uv@v5.1.0
        with:
          version: "0.11.11"
      - name: Start WireMock
        run: |
          docker run -d --name wiremock -p 8081:8080 \
            -v "$PWD/mocks/wiremock/mappings:/home/wiremock/mappings:ro" \
            -v "$PWD/mocks/wiremock/__files:/home/wiremock/__files:ro" \
            wiremock/wiremock:3.13.2 --global-response-templating
          for i in $(seq 1 40); do
            curl -fsS "$MOCKS_BASE_URL/__admin/health" >/dev/null && exit 0
            sleep 2
          done
          docker logs wiremock
          exit 1
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Integration tests
        working-directory: backend
        run: uv run pytest tests/integration -q
      - name: WireMock logs on failure
        if: failure()
        run: docker logs wiremock | tail -100

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
