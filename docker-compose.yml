# Умный кредитный кабинет: запуск одной командой `docker compose up --build`.
# Все значения имеют дефолты, поэтому .env не обязателен (см. .env.example).
name: credit-cabinet

services:
  db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
      POSTGRES_DB: ${POSTGRES_DB:-credit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт БД на хост не публикуется: api и tests ходят к ней по имени сервиса db во внутренней сети compose.
    # Для локальной разработки порт открывает docker-compose.override.example.yml.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: runtime
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/${POSTGRES_DB:-credit}
      # Пусто/слабо/демо-значение: при старте создаётся случайный секрет и хранится на volume jwtdata
      JWT_SECRET: ${JWT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      DEMO_SIGN_CODE: ${DEMO_SIGN_CODE:-123456}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PIPELINE_STEP_DELAY_SECONDS: "0"
      MOCKS_BASE_URL: http://mocks:8080
      # Ключевая ставка ЦБ и дата расчёта возраста; пусто = значения из policy.yaml / сегодня (Europe/Moscow)
      KEY_RATE_PCT: ${KEY_RATE_PCT:-}
      KEY_RATE_DATE: ${KEY_RATE_DATE:-}
      AS_OF_DATE: ${AS_OF_DATE:-}
      OFFER_TTL_DAYS: ${OFFER_TTL_DAYS:-30}
      INFO_REQUEST_TTL_DAYS: ${INFO_REQUEST_TTL_DAYS:-14}
    volumes:
      - jwtdata:/app/data
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      # в slim-образе нет curl, поэтому проверяем средствами Python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # Моки внешних сервисов (ЕГРЮЛ, ФНС, БКИ). Стабы лежат в mocks/wiremock/.
  mocks:
    image: wiremock/wiremock:3.13.2
    command: ["--global-response-templating"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./mocks/wiremock/mappings:/home/wiremock/mappings:ro
      - ./mocks/wiremock/__files:/home/wiremock/__files:ro
    ports:
      - "${MOCKS_PORT:-8081}:8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Тесты ядра против настоящего PostgreSQL:
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "0" # тесты сами создают тестовую БД и накатывают миграции
      PIPELINE_STEP_DELAY_SECONDS: "0"
      AS_OF_DATE: "2026-10-23" # детерминированные пороги возраста компании
      DOCS_DIR: /docs # тесты сверяют зафиксированные docs/api/openapi.yaml и docs/state-machine.md с кодом
    volumes:
      - ./docs:/docs:ro
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_healthy

volumes:
  pgdata:
  jwtdata:
