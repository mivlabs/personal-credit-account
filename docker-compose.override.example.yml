# Только для локальной разработки и тестов: публикует PostgreSQL на хост (127.0.0.1).
# По умолчанию порт БД не публикуется, чтобы запуск у проверяющих не зависел от занятых и зарезервированных портов.
#
# Использование (файл подключается явно, переименовывать в docker-compose.override.yml не нужно):
#   docker compose -f docker-compose.yml -f docker-compose.override.example.yml up -d db mocks
#
# 5433 лежит ниже динамического диапазона 49152–65535, который Windows (Hyper-V/WSL) может резервировать.
# Если порт занят, задайте другой через DB_HOST_PORT в .env.
services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
