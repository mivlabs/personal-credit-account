          title: History
          description: История переходов статуса, от старых к новым
        openInfoRequests:
          items:
            $ref: '#/components/schemas/InfoRequestOut'
          type: array
          title: Openinforequests
          description: Открытые запросы данных
        decision:
          anyOf:
          - $ref: '#/components/schemas/ClientDecisionOut'
          - type: 'null'
          description: Последнее решение
        decisionExplanation:
          anyOf:
          - $ref: '#/components/schemas/DecisionExplanationOut'
          - type: 'null'
          description: Как принято последнее решение
        offer:
          anyOf:
          - $ref: '#/components/schemas/OfferOut'
          - type: 'null'
          description: Актуальный оффер
      type: object
      required:
      - availableActions
      - id
      - companyId
      - product
      - status
      - statusName
      - requestedAmount
      - termMonths
      - purpose
      - revenueAmount
      - debtAmount
      - draftStep
      - submittedAt
      - createdAt
      - updatedAt
      - history
      - openInfoRequests
      - decision
      - decisionExplanation
      - offer
      title: ApplicationOut
      examples:
      - companyId: 1
        createdAt: '2026-10-22T09:00:00+03:00'
        debtAmount: 0.0
        decision:
          decidedAt: '2026-10-22T09:15:04+03:00'
          outcome: APPROVED
          reason: Стабильная выручка и чистая кредитная история
        draftStep: 3
        history:
        - at: '2026-10-22T09:00:00+03:00'
