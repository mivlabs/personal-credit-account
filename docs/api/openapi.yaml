          - 'Демо-режим: для подписания введите код 123456'
      type: object
      required:
      - application
      - signHint
      title: AcceptOfferResponse
    ApplicationCreate:
      properties:
        requestedAmount:
          anyOf:
          - type: number
            multipleOf: 0.01
            minimum: 0.0
            description: Сумма в рублях, не более 2 знаков после запятой
          - type: 'null'
          title: Requestedamount
          description: Запрошенная сумма, ₽
        termMonths:
          anyOf:
          - type: integer
            maximum: 600.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Termmonths
          description: Срок, мес.
        purpose:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Purpose
          description: Цель кредита
        revenueAmount:
          anyOf:
          - type: number
            multipleOf: 0.01
            minimum: 0.0
            description: Сумма в рублях, не более 2 знаков после запятой
          - type: 'null'
          title: Revenueamount
          description: Годовая выручка со слов клиента, ₽
        debtAmount:
          anyOf:
          - type: number
            multipleOf: 0.01
            minimum: 0.0
            description: Сумма в рублях, не более 2 знаков после запятой
          - type: 'null'
          title: Debtamount
          description: Текущая долговая нагрузка, ₽
        productCode:
          $ref: '#/components/schemas/ProductCode'
        draftStep:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 1.0
          - type: 'null'
          title: Draftstep
          description: Шаг мастера, на котором остановился клиент
      additionalProperties: false
      type: object
      required:
      - productCode
      title: ApplicationCreate
      description: 'Создание черновика: продукт обязателен, остальные поля можно прислать позже.'
      examples:
      - draftStep: 2
        productCode: EQUIPMENT
        requestedAmount: 1500000.0
        termMonths: 24
    ApplicationField:
      type: string
      enum:
      - requestedAmount
      - termMonths
      - purpose
      - revenueAmount
      - debtAmount
      title: ApplicationField
      description: Поля анкеты, которые клиент заполняет сам и которые банк может запросить повторно.
    ApplicationOut:
      properties:
        availableActions:
          items:
            type: string
          type: array
          title: Availableactions
          description: Допустимые действия для текущей роли
        id:
          type: integer
          title: Id
        companyId:
          type: integer
          title: Companyid
        product:
          $ref: '#/components/schemas/ProductOut'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        statusName:
          type: string
          title: Statusname
        requestedAmount:
          anyOf:
          - type: number
            multipleOf: 0.01
            minimum: 0.0
            description: Сумма в рублях, не более 2 знаков после запятой
          - type: 'null'
          title: Requestedamount
        termMonths:
          anyOf:
          - type: integer
          - type: 'null'
          title: Termmonths
        purpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
        revenueAmount:
          anyOf:
          - type: number
            multipleOf: 0.01
            minimum: 0.0
            description: Сумма в рублях, не более 2 знаков после запятой
          - type: 'null'
          title: Revenueamount
        debtAmount:
          anyOf:
          - type: number
            multipleOf: 0.01
            minimum: 0.0
            description: Сумма в рублях, не более 2 знаков после запятой
          - type: 'null'
          title: Debtamount
        draftStep:
          anyOf:
          - type: integer
          - type: 'null'
          title: Draftstep
        submittedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Submittedat
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        history:
          items:
            $ref: '#/components/schemas/StatusHistoryItem'
