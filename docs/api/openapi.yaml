openapi: 3.1.0
info:
  title: Умный кредитный кабинет — API ядра
  description: 'Бэкенд кредитного конвейера для малого бизнеса: клиент проходит путь от выбора продукта до выдачи кредита,

    банк ведёт ту же заявку в той же системе.


    **Авторизация.** `POST /auth/login` → `accessToken` (новый клиент: `POST /auth/register` по ИНН возвращает то же); дальше
    заголовок `Authorization: Bearer <token>`.


    **Формат данных.** JSON в camelCase. Деньги — число в рублях (до 2 знаков), ставка — число, % годовых.

    Даты и время — ISO 8601 с часовым поясом.


    **Ошибки.** Формат RFC 7807 (`application/problem+json`): `type`, `title`, `status`, `detail`, машинный `code`

    (`VALIDATION_ERROR`, `INVALID_TRANSITION`, `NOT_FOUND`, `FORBIDDEN`, `IDEMPOTENCY_CONFLICT` …) и `errors[]` по полям.


    **Идемпотентная подача.** `POST /applications/{id}/submit` требует заголовок `Idempotency-Key`; повтор с тем же

    ключом возвращает ту же заявку и ничего не создаёт.


    **Статусы.** Меняются только по стейт-машине (`docs/state-machine.md`); недопустимый переход — 409 `INVALID_TRANSITION`.'
  version: 1.0.0
servers:
- url: http://localhost:8000
  description: Локальный запуск через docker compose
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Вход по логину и паролю
      description: 'Возвращает JWT и данные пользователя. Неверный логин или пароль — 401 `INVALID_CREDENTIALS`.


        5 неудачных попыток за 5 минут для связки логин + IP дают 429 `TOO_MANY_REQUESTS` с `Retry-After`.'
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Слишком много неудачных попыток входа; смотрите заголовок `Retry-After`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Регистрация клиента по ИНН
      description: 'Без авторизации. Проверяет ИНН по контрольным числам ФНС, запрашивает ЕГРЮЛ и создаёт компанию

        с клиентом; в ответе то же, что у входа (токен и пользователь), повторно входить не нужно.


        422 `VALIDATION_ERROR` с `errors[]` по полям `login`, `password`, `inn`; 409 `LOGIN_TAKEN` / `INN_TAKEN`;

        503 `EGRUL_UNAVAILABLE` (компания не создаётся); 429 `TOO_MANY_REQUESTS` при превышении лимита попыток с IP.

        Сценарий проверки в моках задаёт 9-я цифра ИНН (docs/test-accounts.md).'
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '409':
          description: Логин занят (`LOGIN_TAKEN`) или ИНН уже зарегистрирован (`INN_TAKEN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: Слишком много неудачных попыток входа; смотрите заголовок `Retry-After`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: ЕГРЮЛ недоступен (`EGRUL_UNAVAILABLE`), компания не создана
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Текущий пользователь
      description: Данные пользователя, которому принадлежит токен.
      operationId: getCurrentUser
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearerAuth: []
  /api/v1/products:
    get:
      tags:
      - products
      summary: Каталог кредитных продуктов
      description: Активные продукты с диапазонами суммы и срока, базовой ставкой и требованиями.
      operationId: listProducts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProductOut'
                type: array
                title: Response Listproducts
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearerAuth: []
  /api/v1/products/recommendations:
    post:
      tags:
      - products
      summary: Подбор продукта по цели
      description: Продукты по убыванию соответствия цели, сумме и сроку, с причинами оценки. Без LLM, правила в `recommendation.yaml`.
      operationId: recommendProducts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearerAuth: []
  /api/v1/companies/me:
    get:
      tags:
      - companies
      summary: Профиль моей компании
      description: 'Данные компании клиента (название, ОГРН, адрес, дата регистрации): клиент не вводит их повторно.


        Сохранённый профиль обновляется из локального ЕГРЮЛ отдельной командой POST /companies/me/enrich.'
      operationId: getMyCompany
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Не найдено. Для клиента заявка другой компании тоже отдаёт 404
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - bearerAuth: []
  /api/v1/companies/me/enrich:
    post:
      tags:
      - companies
      summary: Обновить профиль из ЕГРЮЛ
      operationId: enrichMyCompany
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyOut'
      security:
      - bearerAuth: []
  /api/v1/applications:
    get:
      tags:
      - applications
      summary: Мои заявки
      description: Заявки компании клиента, новые сверху. По списку клиент находит свой черновик.
      operationId: listMyApplications
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ApplicationStatus'
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationSummary'
                title: Response Listmyapplications
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      tags:
      - applications
      summary: Создать черновик заявки
      description: 'Создаёт заявку в статусе `DRAFT`: обязателен только `productCode`, остальное можно прислать позже.'
      operationId: createApplication
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/applications/{application_id}:
    get:
      tags:
      - applications
      summary: 'Заявка: статус, анкета, решение, оффер'
      description: 'Заявка с историей переходов, открытыми запросами данных, решением и оффером.


        Решение для клиента — исход и причина простым языком, без баллов. Клиент видит только заявки своей

        компании (чужая — 404), андеррайтер — любые.'
      operationId: getApplication
      security:
      - bearerAuth: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор заявки
          title: Application Id
        description: Идентификатор заявки
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Не найдено. Для клиента заявка другой компании тоже отдаёт 404
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    patch:
      tags:
      - applications
      summary: Обновить черновик
      description: Сохраняет поля анкеты и шаг мастера (`draftStep`). Только в статусе `DRAFT`, иначе 409 `INVALID_TRANSITION`.
      operationId: updateApplication
      security:
      - bearerAuth: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор заявки
          title: Application Id
        description: Идентификатор заявки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Не найдено. Для клиента заявка другой компании тоже отдаёт 404
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Действие недопустимо в текущем статусе заявки или конфликт ключа идемпотентности
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/applications/{application_id}/submit:
    post:
      tags:
      - applications
      summary: Подать заявку
      description: 'Проверяет обязательные поля (`requestedAmount`, `termMonths`, `purpose`) и диапазоны продукта,

        переводит заявку `DRAFT → SUBMITTED` и запускает конвейер обработки. Ответ 202 содержит результат ограниченного синхронного
        конвейера.


        Другой ключ на уже поданную заявку или тот же ключ на другую заявку — 409 `IDEMPOTENCY_CONFLICT`.'
      operationId: submitApplication
      security:
      - bearerAuth: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор заявки
          title: Application Id
        description: Идентификатор заявки
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Уникальный ключ подачи (например, UUID). Повтор с тем же ключом не создаёт ничего нового
          title: Idempotency-Key
        description: Уникальный ключ подачи (например, UUID). Повтор с тем же ключом не создаёт ничего нового
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '200':
          description: 'Повтор с тем же `Idempotency-Key`: возвращена та же заявка'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Не найдено. Для клиента заявка другой компании тоже отдаёт 404
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Действие недопустимо в текущем статусе заявки или конфликт ключа идемпотентности
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/applications/{application_id}/timeline:
    get:
      tags:
      - applications
      summary: Таймлайн статуса
      description: Этапы с состоянием `done` / `current` / `upcoming`, флагом `actionRequired` и историей переходов.
      operationId: getApplicationTimeline
      security:
      - bearerAuth: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор заявки
          title: Application Id
        description: Идентификатор заявки
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Не найдено. Для клиента заявка другой компании тоже отдаёт 404
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/applications/{application_id}/missing-info:
    patch:
      tags:
      - applications
      summary: Дозаполнить запрошенные данные
      description: 'Принимает только поля из открытого запроса данных (прочие — 422). Запрос становится `ANSWERED`,

        заявка `NEEDS_INFO → CHECKING`, конвейер запускается заново.'
      operationId: answerMissingInfo
      security:
      - bearerAuth: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор заявки
          title: Application Id
        description: Идентификатор заявки
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MissingInfoAnswer'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Ошибка валидации: `errors[]` указывает на поля'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Не найдено. Для клиента заявка другой компании тоже отдаёт 404
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Действие недопустимо в текущем статусе заявки или конфликт ключа идемпотентности
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/applications/{application_id}/offer/accept:
    post:
      tags:
      - applications
      summary: Принять оффер или контроффер
      description: '`APPROVED` / `COUNTER_OFFER` → `OFFER_ACCEPTED` → `SIGNING`. В ответе подсказка с демо-кодом подписи.'
      operationId: acceptOffer
      security:
      - bearerAuth: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор заявки
          title: Application Id
        description: Идентификатор заявки
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptOfferResponse'
        '401':
          description: Нет токена, он недействителен или истёк
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '403':
          description: Роль пользователя не позволяет это действие
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Не найдено. Для клиента заявка другой компании тоже отдаёт 404
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Действие недопустимо в текущем статусе заявки или конфликт ключа идемпотентности
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
