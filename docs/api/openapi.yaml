  /api/v1/underwriter/applications/{application_id}/decision:
    post:
      tags:
      - underwriter
      summary: Принять ручное решение
      description: 'Исходы: `APPROVED`, `COUNTER_OFFER`, `NEEDS_INFO`, `REJECTED`. Комментарий обязателен (иначе 422);

        для `COUNTER_OFFER` обязателен `offerAmount`, для `NEEDS_INFO` — `infoRequest`.

        Допустимо только для заявок в `MANUAL_REVIEW`, иначе 409 `INVALID_TRANSITION`.'
      operationId: makeUnderwriterDecision
      security:
      - bearerAuth: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор заявки
          title: Application Id
        description: Идентификатор заявки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
            examples:
              approve:
                summary: Одобрить
                value:
                  outcome: APPROVED
                  comment: Молодая компания, но выручка подтверждена выпиской
                  clientReason: Выручка компании подтверждает возможность платить по кредиту
              counterOffer:
                summary: Встречное предложение
                value:
                  outcome: COUNTER_OFFER
                  comment: Сумма выше допустимой долговой нагрузки
                  clientReason: 'Мы можем предложить меньшую сумму: так платёж будет комфортнее'
                  offerAmount: 2000000.0
              needsInfo:
                summary: Запросить данные
                value:
                  outcome: NEEDS_INFO
                  comment: Нет подтверждения выручки
                  infoRequest:
                    description: Укажите годовую выручку за последний год
                    fields:
                    - revenueAmount
              reject:
                summary: Отказать
                value:
                  outcome: REJECTED
                  comment: Высокая долговая нагрузка
                  clientReason: Сейчас долговая нагрузка компании выше допустимой
      responses:
        '200':
          description: Successful Response
