[alembic]
script_location = alembic
# Make the `app` package importable when alembic runs from the backend directory (also in Docker).
prepend_sys_path = .
path_separator = os
# Revision files are named 0001_slug.py; order is defined by down_revision, not by date.
file_template = %%(rev)s_%%(slug)s
# The database URL comes from the DATABASE_URL environment variable (see alembic/env.py).
# Keep this file ASCII-only: Alembic reads it with the OS locale encoding on Windows.
sqlalchemy.url =
